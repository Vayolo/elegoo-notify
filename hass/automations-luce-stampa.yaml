- alias: 'Stampante 3D: luce automatica'
  id: stampante_luce_automatica
  description: 'Accende la luce interna della stampante quando inizia una stampa e
    la spegne 5 minuti dopo la fine. Se una nuova stampa parte entro i 5 minuti, il
    timer si azzera e la luce resta accesa.

    '
  mode: restart
  trigger:
  - platform: state
    entity_id: binary_sensor.elegoo_centauri_carbon_in_stampa
    to: 'on'
    id: started
  - platform: state
    entity_id: binary_sensor.elegoo_centauri_carbon_in_stampa
    to: 'off'
    for: 00:05:00
    id: finished
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: started
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.elegoo_centauri_carbon_luce_interna
    - conditions:
      - condition: trigger
        id: finished
      sequence:
      - service: light.turn_off
        target:
          entity_id: light.elegoo_centauri_carbon_luce_interna
