# Elegoo Centauri Carbon — COSMOS (Klipper/Kalico) per PrusaSlicer
# KLIPPER-NATIVO: la macchina gestisce DA SOLA homing, purge adattivo,
# bed mesh e heat soak (cosmos.conf). Lo start gcode è MINIMALE:
# solo temperature. VIETATI i comandi stock M729/M6211/M8213
# (COSMOS li rifiuta con emergency stop).
bed_shape = 0x0,256x0,256x256,0x256
bed_size = 256,256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
gcode_flavor = marlin
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_lift = 0.2
retract_speed = 40
deretraction_speed = 40
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
z_offset = 0
gcode_comments = 1
output_filename_format = [input_filename_base].gcode
printer_model = ELEGOO_CENTAURI_CARBON_COSMOS
start_gcode = ;--- COSMOS start (minimale: la macchina fa da sé mesh/purge) ---
M140 S[first_layer_bed_temperature] ; bed temp (COSMOS fa heat soak)
M104 S[first_layer_temperature] ; nozzle temp

end_gcode = ;--- COSMOS end ---
M140 S0
M104 S0
M107

layer_gcode = G92 E0
between_objects_gcode =
printer_notes = Per COSMOS/Klipper. Importa il profilo ufficiale Orca "OpenCentauri COSMOS" per tuning fini (pressure advance, volumetrici). VIETATO usare i profili stock (M729 = emergency stop).
