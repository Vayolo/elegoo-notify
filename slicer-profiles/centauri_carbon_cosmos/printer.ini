# Elegoo Centauri Carbon — COSMOS (Klipper/Kalico) per PrusaSlicer
# PROFILO UFFICIALE COSMOS: start/end = PRINT_START / PRINT_END (macros.cfg
# del firmware, verificate sulla macchina). La macro gestisce DA SOLA:
# check calibrazione, filamento, homing, heat soak (cosmos.conf), bed mesh,
# purge adattivo e temperature. Parametri: BED=, EXTRUDER=, CHAMBER= (opt).
# VIETATI i comandi stock M729/M8213 (macro con emergency stop su COSMOS).
bed_shape = 0x0,256x0,256x256,0x256
bed_size = 256,256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
gcode_flavor = marlin
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_lift = 0.2
retract_speed = 40
deretraction_speed = 40
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
z_offset = 0
gcode_comments = 1
output_filename_format = [input_filename_base].gcode
printer_model = ELEGOO_CENTAURI_CARBON_COSMOS
start_gcode = PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]\n
end_gcode = PRINT_END\n
layer_gcode = G92 E0
between_objects_gcode =
printer_notes = Protocollo ufficiale COSMOS (PRINT_START/PRINT_END). Per ABS aggiungi CHAMBER=xx a start_gcode. VIETATO usare i profili stock (M729/M8213 = emergency stop).
