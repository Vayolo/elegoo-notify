# Elegoo Centauri Carbon 0.4 — profilo stampante per PrusaSlicer
# Derivato dal profilo UFFICIALE Elegoo/OrcaSlicer "Elegoo Centauri Carbon 0.4 nozzle"
# (SoftFever/OrcaSlicer resources/profiles/Elegoo, 2026-04): start/end gcode
# originali (M729 clean nozzle, M6211, M83 estrusione RELATIVA, prime line).
bed_shape = 0x0,256x0,256x256,0x256
bed_size = 256,256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
gcode_flavor = marlin
# IL profilo ufficiale usa M83: estrusione RELATIVA (obbligatorio!)
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_lift = 0.2
retract_speed = 40
deretraction_speed = 40
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
z_offset = 0
gcode_comments = 1
output_filename_format = [input_filename_base].gcode
printer_model = ELEGOO_CENTAURI_CARBON
; NB: PrusaSlicer auto-emette M104/M140 (preheat async) PRIMA dello start
; gcode: compatibile con la sequenza ufficiale (il M190/M109 resta qui).
start_gcode = ;===== CC_START_GCODE (ufficiale Elegoo, adattato PrusaSlicer) =====\nM400 ; wait for buffer to clear\nM220 S100 ;Set the feed speed to 100%\nM221 S100 ;Set the flow rate to 100%\nM104 S140\nM140 S[first_layer_bed_temperature]\nG90\nM83\nG28 ;home\nM729 ;Clean Nozzle\nM190 S[first_layer_bed_temperature]\n\nM109 S[first_layer_temperature]\nM6211 A1 L200 T0 Q[first_layer_temperature] R[first_layer_temperature] S[first_layer_temperature]\nT0\n; filament_start_gcode (per materiale) prosegue da qui con le prime line\nM204 S5000 ;Call exterior wall print acceleration (ECC official)\n\nG1 X128 Y-1.2 F20000\nG1 Z0.3 F900\n\n\nG90\nM83\nG92 E0 ;Reset Extruder\n
end_gcode = ;===== CC_END_GCODE (ufficiale Elegoo, adattato PrusaSlicer) =====\nM400 ; wait for buffer to clear\nM140 S0 ;Turn-off bed\nM106 S255 ;Cooling nozzle\nM83\nG92 E0 ; zero the extruder\nG1 E-0.8 F1800\nG2 I1 J0 Z{max_layer_z + 0.5} F3000 ; lower z a little\nG90\n{if max_layer_z > 100}G1 Z{max_layer_z + 50} F20000{else}G1 Z100 F20000{endif}; Move print head up\nM204 S5000\nM749\nM204 S5000\nM400\nM83\nG1 X202 F20000\nM400\nG1 Y250 F20000\nG1 Y264.5 F1200\nM400\nG92 E0\nM104 S0 ;Turn-off hotend\nM140 S0 ;Turn-off bed\nM106 S0 ; turn off fan\nM106 P2 S0 ; turn off remote part cooling fan\nM106 P3 S0 ; turn off chamber cooling fan\nM84 ;Disable all steppers\n
layer_gcode = G92 E0 ; richiesto da PrusaSlicer con estrusione relativa (M83)
between_objects_gcode =
printer_notes = Start/end gcode dal profilo ufficiale Elegoo Centauri Carbon (OrcaSlicer). Velocita' nei print.ini derivate da "0.20mm Standard @Elegoo CC 0.4".
