# Elegoo Centauri Carbon — profilo stampante (PrusaSlicer)
# 256x256x256 mm, estrusore direct-drive 0.4mm, filamento 1.75
bed_shape = 0x0,256x0,256x256,0x256
bed_size = 256,256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
extrusion_multiplier = 1
gcode_flavor = marlin
use_relative_e_distances = 0
use_firmware_retraction = 0
retract_length = 0.8
retract_lift = 0.2
retract_speed = 40
deretraction_speed = 40
retract_before_travel = 2
retract_layer_change = 1
wipe = 0
z_offset = 0
gcode_comments = 1
output_filename_format = [input_filename_base].gcode
start_gcode = G28 ; home\nG92 E0\nG1 Z5 F600\n
end_gcode = M107\nM104 S0 ; nozzle off\nM140 S0 ; bed off\nG91\nG1 E-2 F300\nG90\nG28 X0 ; present\nM84 ; motor off\n
between_objects_gcode =
printer_model = ELEGOO_CENTAURI_CARBON
printer_notes = Profilo comunitario minimal per elegoo-notify (slicing CLI). Regola start/end gcode se usi macro custom.
